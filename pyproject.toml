[project]
name = "freshkart-build-week"
version = "0.1.0"
description = "FreshKart Support Desk: a LangChain (LCEL) customer-support bot with a Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "streamlit>=1.35",
]

[dependency-groups]
notebook = [
    "jupyter",
    "nbconvert",
    "ipykernel",
]
dev = [
    "pytest",
]

[tool.uv]
default-groups = ["dev", "notebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
